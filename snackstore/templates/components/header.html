<header class="header">
  <div class="header-container">
    <a href="{% url 'snacks:list' %}" class="logo" aria-label="Về trang chủ Snackstore">
      <span class="logo-icon" aria-hidden="true"></span>
      <span class="logo-text">SNACK</span>
    </a>

    <nav class="nav-menu" aria-label="Điều hướng chính">
      <a href="{% url 'snacks:list' %}" class="nav-link{% if request.resolver_match.url_name == 'list' %} active{% endif %}">
        Trang chủ
      </a>
      <a href="{% url 'snacks:list' %}#products" class="nav-link">Sản phẩm</a>
      <a href="{% url 'cart:detail' %}" class="nav-link">Giỏ hàng</a>
      {% if user.is_authenticated %}
      <a href="{% url 'orders:list' %}" class="nav-link">Đơn mua</a>
      {% endif %}
    </nav>

    <div class="header-right">
      <div class="user-auth">
        {% if user.is_authenticated %}
        <div class="user-dropdown">
          <button type="button" class="user-greeting" onclick="toggleDropdown()" aria-expanded="false">
            <span>Xin chào,</span>
            <strong>{{ user.first_name|default:user.username }}</strong>
            <i class="fas fa-chevron-down dropdown-arrow" aria-hidden="true"></i>
          </button>
          <div class="dropdown-menu" id="userDropdown">
            {% if user.is_staff %}
            <a href="{% url 'snacks:admin_dashboard' %}" class="dropdown-item">
              <i class="fas fa-tachometer-alt"></i> Dashboard Admin
            </a>
            <a href="/admin/" class="dropdown-item">
              <i class="fas fa-cog"></i> Quản trị Django
            </a>
            {% endif %}
            <a href="{% url 'orders:list'%}" class="dropdown-item">
              <i class="fas fa-receipt"></i> Đơn mua
            </a>
            <a href="{% url 'snacks:logout' %}" class="dropdown-item">
              <i class="fas fa-sign-out-alt"></i> Đăng xuất
            </a>
          </div>
        </div>
        {% else %}
        <a href="{% url 'snacks:login' %}" class="auth-btn login-btn">
          <i class="fas fa-sign-in-alt"></i> Đăng nhập
        </a>
        <a href="{% url 'snacks:register' %}" class="auth-btn register-btn">
          <i class="fas fa-user-plus"></i> Đăng ký
        </a>
        {% endif %}
      </div>

      <a href="{% url 'cart:detail' %}" class="icon-btn cart-link" aria-label="Xem giỏ hàng">
        <i class="fa fa-shopping-bag" aria-hidden="true"></i>
        <span class="cart-count-badge">{{ cart_count|default:0 }}</span>
      </a>
    </div>
  </div>
</header>

<script>
  function toggleDropdown() {
    const dropdown = document.getElementById("userDropdown");
    const button = document.querySelector(".user-greeting");
    if (!dropdown || !button) return;
    dropdown.classList.toggle("show");
    button.setAttribute("aria-expanded", dropdown.classList.contains("show"));
  }

  window.addEventListener("click", function (event) {
    const dropdown = document.getElementById("userDropdown");
    if (!dropdown) return;
    const clickedInside = event.target.closest(".user-dropdown");
    if (!clickedInside) dropdown.classList.remove("show");
  });
</script>
