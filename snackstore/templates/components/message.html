{% if messages %}
<style>
  .message-container {
    width: min(1080px, calc(100% - 32px));
    margin: 16px auto 0;
  }

  .message-alert {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 10px;
    padding: 12px 14px;
    border-radius: 8px;
    border: 1px solid #d9dee8;
    color: #111827;
    background: #f8fafc;
    font-size: 14px;
    font-weight: 650;
  }

  .message-alert.success {
    border-color: #bbf7d0;
    color: #166534;
    background: #f0fdf4;
  }

  .message-alert.warning {
    border-color: #fde68a;
    color: #92400e;
    background: #fffbeb;
  }

  .message-alert.error {
    border-color: #fecaca;
    color: #991b1b;
    background: #fef2f2;
  }
</style>
<div class="message-container">
  {% for message in messages %}
  <div class="message-alert {{ message.tags }}" role="alert">
    {{ message }}
  </div>
  {% endfor %}
</div>
{% endif %}
