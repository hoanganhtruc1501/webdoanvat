{% load static %}

<link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.css" />
<link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick-theme.css" />

<section class="hero-banner hero-slider" aria-label="Banner giới thiệu Snackstore">
  <div class="hero-copy">
    <span class="hero-eyebrow"><i class="fas fa-bolt"></i> Ưu đãi đồ ăn vặt hôm nay</span>
    <h1>Snack ngon, giao nhanh, giá cực dễ thương</h1>
    <p>Khám phá bánh tráng, chân gà, snack, nước uống và nhiều món ăn vặt được chọn lọc cho bạn.</p>
    <div class="hero-actions">
      <a href="#products" class="hero-btn primary"><i class="fas fa-shopping-basket"></i> Mua ngay</a>
      <a href="#reviews-title" class="hero-btn secondary">Xem đánh giá</a>
    </div>
    <div class="hero-stats" aria-label="Điểm mạnh của cửa hàng">
      <span><strong>1-3 ngày</strong> giao hàng</span>
      <span><strong>100%</strong> đóng gói kỹ</span>
      <span><strong>24/7</strong> hỗ trợ</span>
    </div>
  </div>

  <div class="hero-media" aria-label="Ảnh banner sản phẩm">
    <div class="hero-slides banner-slider">
      <div class="hero-slide"><img src="/media/snacks/Banner1.jpg" alt="Banner đồ ăn vặt Snackstore 1" /></div>
      <div class="hero-slide"><img src="/media/snacks/banner2.jpg" alt="Banner đồ ăn vặt Snackstore 2" /></div>
      <div class="hero-slide"><img src="/media/snacks/banner3.jpg" alt="Banner đồ ăn vặt Snackstore 3" /></div>
      <div class="hero-slide"><img src="/media/snacks/banner4.jpg" alt="Banner đồ ăn vặt Snackstore 4" /></div>
    </div>

    <div class="floating-card top-card"><i class="fas fa-star"></i> Sản phẩm bán chạy</div>
    <div class="floating-card bottom-card"><i class="fas fa-truck-fast"></i> Giao hàng nhanh</div>
  </div>
</section>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.min.js"></script>
<script type="text/javascript">
  $(document).ready(function () {
    $(".banner-slider").not(".slick-initialized").slick({
      infinite: true,
      slidesToShow: 1,
      slidesToScroll: 1,
      autoplay: true,
      autoplaySpeed: 4000,
      dots: true,
      arrows: true,
      fade: true,
      cssEase: "linear",
    });
  });
</script>
