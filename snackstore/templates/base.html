{% load static %}
<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Snackstore{% endblock %}</title>

    <link rel="preconnect" href="https://cdnjs.cloudflare.com" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <link rel="stylesheet" href="{% static 'css/theme.css' %}?v=4" />
    <link rel="stylesheet" href="{% static 'css/main.css' %}?v=6" />
    <link rel="stylesheet" href="{% static 'css/header.css' %}?v=6" />
    <link rel="stylesheet" href="{% static 'css/footer.css' %}?v=6" />
    {% block extra_css %}{% endblock %}
  </head>
  <body>
    {% include 'components/header.html' %}
    {% include 'components/message.html' %}

    <main class="site-main">{% block content %}{% endblock %}</main>

    {% include 'components/footer.html' %}

    <script src="{% static 'js/main.js' %}?v=4"></script>
  </body>
</html>
